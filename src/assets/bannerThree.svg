<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <filter id="naturalShadow3" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow3" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#naturalShadow3)">
    <rect x="40" y="30" width="600" height="390" rx="14" fill="#0f172a"/>
    <rect x="48" y="38" width="584" height="374" rx="6" fill="#f8fafc"/>

    <!-- App Topbar -->
    <rect x="48" y="38" width="584" height="44" fill="#ffffff"/>
    <line x1="48" y1="82" x2="632" y2="82" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="68" cy="60" r="4.5" fill="#f87171"/>
    <circle cx="82" cy="60" r="4.5" fill="#fbbf24"/>
    <circle cx="96" cy="60" r="4.5" fill="#34d399"/>

    <text x="120" y="64" font-family="sans-serif" font-size="13" font-weight="700" fill="#154674">ক্যাশ বই - ব্যবসা অ্যানালিটিক্স ও রিপোর্ট</text>

    <!-- Sidebar -->
    <rect x="48" y="82" width="110" height="330" fill="#ffffff"/>
    <line x1="158" y1="82" x2="158" y2="412" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="70" y="118" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">📊 ওভারভিউ</text>
    <text x="70" y="150" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">💰 ক্যাশ খাতা</text>
    <text x="70" y="180" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">📒 বাকি খাতা</text>
    <text x="70" y="210" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">👥 কাস্টমার</text>
    <rect x="58" y="225" width="90" height="28" rx="6" fill="#e0f2fe"/>
    <text x="70" y="243" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284c7">📈 রিপোর্ট</text>

    <!-- Report & Bar Chart Content -->
    <g transform="translate(175, 96)">
      <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">মাসিক লাভ ও ক্ষতির বিবরণী</text>
      
      <!-- Top Metrics -->
      <rect x="0" y="40" width="135" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#64748b">মোট বিক্রয়</text>
      <text x="12" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7">৳ ২,৪৫,০০০</text>

      <rect x="145" y="40" width="135" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#64748b" transform="translate(145, 0)">মোট খরচ</text>
      <text x="12" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e11d48" transform="translate(145, 0)">৳ ৫২,০০০</text>

      <rect x="290" y="40" width="152" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#64748b" transform="translate(290, 0)">নিট লাভ (Profit)</text>
      <text x="12" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a" transform="translate(290, 0)">৳ ১,৯৩,০০০</text>

      <!-- Bar Chart Comparison -->
      <rect x="0" y="105" width="442" height="195" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="128" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">বিগত ৬ মাসের ব্যবসার অগ্রগতি</text>

      <!-- Grid lines -->
      <line x1="20" y1="260" x2="420" y2="260" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="20" y1="210" x2="420" y2="210" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="20" y1="160" x2="420" y2="160" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Bars -->
      <rect x="50" y="190" width="24" height="70" rx="4" fill="#e0f2fe"/>
      <rect x="78" y="160" width="24" height="100" rx="4" fill="#009fe3"/>
      <text x="60" y="280" font-family="sans-serif" font-size="9" fill="#64748b">মে</text>

      <rect x="120" y="180" width="24" height="80" rx="4" fill="#e0f2fe"/>
      <rect x="148" y="150" width="24" height="110" rx="4" fill="#009fe3"/>
      <text x="130" y="280" font-family="sans-serif" font-size="9" fill="#64748b">জুন</text>

      <rect x="190" y="170" width="24" height="90" rx="4" fill="#e0f2fe"/>
      <rect x="218" y="140" width="24" height="120" rx="4" fill="#009fe3"/>
      <text x="200" y="280" font-family="sans-serif" font-size="9" fill="#64748b">জুলাই</text>

      <rect x="260" y="160" width="24" height="100" rx="4" fill="#e0f2fe"/>
      <rect x="288" y="130" width="24" height="130" rx="4" fill="#009fe3"/>
      <text x="270" y="280" font-family="sans-serif" font-size="9" fill="#64748b">আগস্ট</text>

      <rect x="330" y="150" width="24" height="110" rx="4" fill="#e0f2fe"/>
      <rect x="358" y="115" width="24" height="145" rx="4" fill="#154674"/>
      <text x="340" y="280" font-family="sans-serif" font-size="9" fill="#154674" font-weight="bold">সেপ্টেম্বর</text>
    </g>

    <!-- Laptop Base -->
    <path d="M 15 420 L 665 420 L 635 435 L 45 435 Z" fill="#cbd5e1"/>
    <rect x="290" y="420" width="100" height="5" rx="2.5" fill="#94a3b8"/>
  </g>

  <!-- Mobile Phone Mockup Overlay -->
  <g filter="url(#phoneShadow3)" transform="translate(585, 90)">
    <rect x="0" y="0" width="225" height="440" rx="34" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="8" width="209" height="424" rx="28" fill="#ffffff"/>
    <rect x="75" y="15" width="75" height="16" rx="8" fill="#0f172a"/>

    <rect x="8" y="38" width="209" height="50" fill="#154674"/>
    <text x="24" y="68" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ব্যবসায়িক রিপোর্ট</text>

    <!-- Report card in Mobile -->
    <g transform="translate(18, 105)">
      <rect x="0" y="0" width="189" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">মাসিক ব্যালেন্স শিট</text>
      <text x="12" y="45" font-family="sans-serif" font-size="9" fill="#64748b">তারিখ: ০১-৩০ সেপ্টেম্বর</text>
      
      <line x1="12" y1="58" x2="177" y2="58" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#475569">মোট বিক্রয়: ৳ ২,৪৫,০০০</text>
      <text x="12" y="98" font-family="sans-serif" font-size="10" fill="#475569">মোট খরচ: ৳ ৫২,০০০</text>
      <text x="12" y="118" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a">নিট লাভ: + ৳ ১,৯৩,০০০</text>

      <rect x="0" y="145" width="189" height="38" rx="8" fill="#154674"/>
      <text x="28" y="169" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">📥 ডাউনলোড PDF রিপোর্ট</text>
    </g>

    <!-- Bottom Nav -->
    <rect x="8" y="385" width="209" height="47" fill="#f8fafc"/>
    <line x1="8" y1="385" x2="217" y2="385" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="50" cy="408" r="8" fill="#009fe3"/>
    <circle cx="112" cy="408" r="8" fill="#cbd5e1"/>
    <circle cx="174" cy="408" r="8" fill="#cbd5e1"/>
  </g>
</svg>
