<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <filter id="naturalShadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow2" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Laptop Mockup -->
  <g filter="url(#naturalShadow2)">
    <rect x="40" y="30" width="600" height="390" rx="14" fill="#0f172a"/>
    <rect x="48" y="38" width="584" height="374" rx="6" fill="#f8fafc"/>

    <!-- App Topbar -->
    <rect x="48" y="38" width="584" height="44" fill="#ffffff"/>
    <line x1="48" y1="82" x2="632" y2="82" stroke="#e2e8f0" stroke-width="1"/>
    
    <circle cx="68" cy="60" r="4.5" fill="#f87171"/>
    <circle cx="82" cy="60" r="4.5" fill="#fbbf24"/>
    <circle cx="96" cy="60" r="4.5" fill="#34d399"/>

    <text x="120" y="64" font-family="sans-serif" font-size="13" font-weight="700" fill="#154674">ক্যাশ বই - বাকি খাতা</text>

    <!-- Sidebar -->
    <rect x="48" y="82" width="110" height="330" fill="#ffffff"/>
    <line x1="158" y1="82" x2="158" y2="412" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="70" y="118" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">📊 ওভারভিউ</text>
    <text x="70" y="150" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">💰 ক্যাশ খাতা</text>
    <rect x="58" y="165" width="90" height="28" rx="6" fill="#e0f2fe"/>
    <text x="70" y="183" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284c7">📒 বাকি খাতা</text>
    <text x="70" y="215" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">👥 কাস্টমার</text>
    <text x="70" y="245" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">📈 রিপোর্ট</text>

    <!-- Ledger Table Content -->
    <g transform="translate(175, 96)">
      <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">গ্রাহকের বাকির তালিকা ও SMS তাগাদা</text>
      
      <!-- Table Header -->
      <rect x="0" y="40" width="442" height="30" rx="4" fill="#f1f5f9"/>
      <text x="12" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">গ্রাহকের নাম</text>
      <text x="160" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">মোবাইল</text>
      <text x="260" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">বকেয়া টাকা</text>
      <text x="360" y="60" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569">অ্যাকশন</text>

      <!-- Row 1 -->
      <rect x="0" y="75" width="442" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">করিম ট্রেডার্স</text>
      <text x="160" y="100" font-family="sans-serif" font-size="10" fill="#64748b">০১৭১১-xxxxxx</text>
      <text x="260" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e11d48">৳ ১২,৫০০</text>
      <rect x="355" y="85" width="75" height="22" rx="4" fill="#009fe3"/>
      <text x="367" y="100" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">SMS পাঠান</text>

      <!-- Row 2 -->
      <rect x="0" y="125" width="442" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">মেসার্স আলম ব্রাদার্স</text>
      <text x="160" y="150" font-family="sans-serif" font-size="10" fill="#64748b">০১৮১২-xxxxxx</text>
      <text x="260" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e11d48">৳ ১৮,২০০</text>
      <rect x="355" y="135" width="75" height="22" rx="4" fill="#009fe3"/>
      <text x="367" y="150" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff">SMS পাঠান</text>

      <!-- Row 3 -->
      <rect x="0" y="175" width="442" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="12" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">রহিম স্টোর</text>
      <text x="160" y="200" font-family="sans-serif" font-size="10" fill="#64748b">০১৯১১-xxxxxx</text>
      <text x="260" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">৳ ০ (পরিশোধ)</text>
      <rect x="355" y="185" width="75" height="22" rx="4" fill="#dcfce7"/>
      <text x="367" y="200" font-family="sans-serif" font-size="9" font-weight="bold" fill="#15803d">পরিশোধিত</text>
    </g>

    <!-- Laptop Base -->
    <path d="M 15 420 L 665 420 L 635 435 L 45 435 Z" fill="#cbd5e1"/>
    <rect x="290" y="420" width="100" height="5" rx="2.5" fill="#94a3b8"/>
  </g>

  <!-- Mobile Phone Mockup Overlay -->
  <g filter="url(#phoneShadow2)" transform="translate(585, 90)">
    <rect x="0" y="0" width="225" height="440" rx="34" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="8" width="209" height="424" rx="28" fill="#ffffff"/>
    <rect x="75" y="15" width="75" height="16" rx="8" fill="#0f172a"/>

    <rect x="8" y="38" width="209" height="50" fill="#154674"/>
    <text x="24" y="68" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">স্বয়ংক্রিয় SMS তাগাদা</text>

    <!-- Message Preview Box in Mobile -->
    <g transform="translate(18, 110)">
      <rect x="0" y="0" width="189" height="120" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="12" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7">SMS প্রিভিউ</text>
      <text x="12" y="48" font-family="sans-serif" font-size="9" fill="#334155">প্রিয় করিম ভাই,</text>
      <text x="12" y="66" font-family="sans-serif" font-size="9" fill="#334155">আপনার বকেয়া ৳ ১২,৫০০ টাকা</text>
      <text x="12" y="84" font-family="sans-serif" font-size="9" fill="#334155">পরিশোধের জন্য বিনীত অনুরোধ।</text>
      <text x="12" y="104" font-family="sans-serif" font-size="9" font-weight="bold" fill="#154674">- ক্যাশ বই হিসাব</text>

      <rect x="0" y="140" width="189" height="38" rx="8" fill="#009fe3"/>
      <text x="35" y="164" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">✓ SMS সেন্ড করুন</text>
    </g>

    <!-- Bottom Nav -->
    <rect x="8" y="385" width="209" height="47" fill="#f8fafc"/>
    <line x1="8" y1="385" x2="217" y2="385" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="50" cy="408" r="8" fill="#009fe3"/>
    <circle cx="112" cy="408" r="8" fill="#cbd5e1"/>
    <circle cx="174" cy="408" r="8" fill="#cbd5e1"/>
  </g>
</svg>
